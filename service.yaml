# Servicio de Cloud Run con dos contenedores: la app (recibe el tráfico) y el
# Collector (sidecar). Las variables ${...} las rellena `make deploy`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
spec:
  template:
    metadata:
      annotations:
        # CPU siempre asignada: el sidecar necesita CPU para enviar trazas entre peticiones.
        run.googleapis.com/cpu-throttling: "false"
        # La app arranca después de que el Collector esté listo.
        run.googleapis.com/container-dependencies: '{"app":["collector"]}'
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - name: app
          image: ${IMAGE_APP}
          ports:
            - name: h2c # HTTP/2 sin TLS: obligatorio para gRPC
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: ${SERVICE}
            - name: OTEL_COLLECTOR_ENDPOINT
              value: localhost:4317
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
        - name: collector
          image: ${IMAGE_COLLECTOR}
          resources:
            limits:
              cpu: "1"
              memory: 256Mi

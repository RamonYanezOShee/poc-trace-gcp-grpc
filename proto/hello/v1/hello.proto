syntax = "proto3";

package hello.v1;

option go_package = "github.com/RamonYanezOShee/poc-trace-gcp-grpc/gen/hello/v1;hellov1";

service HelloService {
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
}
